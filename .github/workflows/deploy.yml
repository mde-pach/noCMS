name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build the editor and the site
        run: |
          npm run build:editor
          npm run build:site

      # The parity gate: proves the editor and the published page still agree.
      # It exists because the container API is experimental and the Astro version
      # is pinned — a bad bump must fail here rather than ship a wrong-looking site.
      - name: Parity gate
        run: |
          npx playwright install --with-deps chromium
          npm run gate

      - run: npx pagefind --site dist
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
